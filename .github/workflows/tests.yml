# .github/workflows/tests.yml
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: server/tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
        run: pytest server/tests
        
  backend:
    name: Backend regression tests and migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: retailos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retailos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retailos_test
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Validate migration graph has exactly one head
        shell: bash
        run: |
          flask --app server.app db heads | tee migration-heads.txt
          head_count=$(grep -c '(head)' migration-heads.txt || true)
          if [ "$head_count" -ne 1 ]; then
            echo "Expected exactly one Alembic migration head, found $head_count."
            exit 1
          fi

      - name: Upgrade an empty PostgreSQL database
        run: flask --app server.app db upgrade

      - name: Verify database reached the migration head
        run: |
          flask --app server.app db current | tee migration-current.txt
          grep -q '(head)' migration-current.txt

      - name: Run backend regression tests
        run: pytest server/tests
